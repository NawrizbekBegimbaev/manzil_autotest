[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "pages", "pages.auth", "pages.common", "pages.super_admin", "pages.shipper", "pages.transport", "utils"]

[project]
name = "manzil-sanity-ui"
version = "0.1.0"
description = "Manzil — daily UI sanity suite (Playwright + pytest, Page Object Model)"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.49",
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "allure-pytest>=2.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "openpyxl>=3.1",
    "requests>=2.32",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
