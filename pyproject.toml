[project]
name = "manzil-api-tests"
version = "0.1.0"
description = "API test suite for Manzil platform (Keycloak JWT, Web/Mobile auth, employees)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "allure-pytest>=2.13",
    "faker>=30.0",
    "filelock>=3.16",
    "python-dotenv>=1.0",
    "hypothesis>=6.115",
    "schemathesis>=3.36",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "api", "api.endpoints", "api.schemas",
    "config", "data", "utils",
    "mobile", "mobile.runner", "mobile.seed", "mobile.tests",
    "mobile.tests.driver", "mobile.tests.driver.orders",
    "mobile.tests.driver.offers", "mobile.tests.driver.profile",
    "mobile.tests.smoke",
    "web_ui", "web_ui.pages", "web_ui.pages.auth", "web_ui.pages.supplier",
    "web_ui.pages.tk", "web_ui.pages._common", "web_ui.seed",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["allure-results", ".venv"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
    "ANN",
    "PT",
]
ignore = [
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "ANN001"]
"conftest.py" = ["ANN201", "ANN001"]
"tests/conftest.py" = ["ANN201", "ANN001"]
"web_ui/**/*.py" = ["ANN201", "ANN001", "ANN202", "ANN204", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
exclude = ["allure-results", ".venv"]

[[tool.mypy.overrides]]
module = ["allure", "allure_pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "web_ui.*"
# Playwright-based UI tests use dynamic locators and page objects where
# strict typing creates more friction than value. Keep base checks (return
# types, attr access) but allow untyped def/calls inside this layer.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
