name: api-tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      MANZIL_ENV: dev
      API_BASE_URL: https://dev-manzil.greatmall.uz
      EMAIL_OTP_MODE: imap_gmail
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      TELEGRAM_OTP_MODE: fixed
      TELEGRAM_OTP: "123456"
      DEFAULT_TEST_PASSWORD: ${{ secrets.MANZIL_TEST_PASSWORD }}
      # Pool range per branch - lowers collision risk between parallel CI runs.
      # 998900200001..998900299999 = ~100k phones, split into 10 ranges.
      PHONE_POOL_START: "998900200001"
      PHONE_POOL_END: "998900299999"
      MANZIL_OTP_CAPTURE: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run API tests (no OTP)
        run: |
          pytest tests/ \
            -n auto \
            -m "not requires_email_otp and not requires_telegram_otp" \
            --tb=short

      - name: Upload allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 14
