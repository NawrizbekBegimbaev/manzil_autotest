name: nightly-full

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC = 07:00 Tashkent
  workflow_dispatch:

jobs:
  api-full:
    runs-on: ubuntu-latest
    env:
      MANZIL_ENV: dev
      API_BASE_URL: https://dev-manzil.greatmall.uz
      EMAIL_OTP_MODE: imap_gmail
      GMAIL_IMAP_USER: ${{ secrets.GMAIL_IMAP_USER }}
      GMAIL_IMAP_APP_PASSWORD: ${{ secrets.GMAIL_IMAP_APP_PASSWORD }}
      TELEGRAM_OTP_MODE: fixed
      TELEGRAM_OTP: "123456"
      DEFAULT_TEST_PASSWORD: ${{ secrets.MANZIL_TEST_PASSWORD }}
      MANZIL_OTP_CAPTURE: "1"
      PHONE_POOL_START: "998900300001"
      PHONE_POOL_END: "998900399999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Full API suite
        run: pytest tests/ -n 4 --tb=line -q
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: allure-api-nightly, path: allure-results/, retention-days: 30 }

  ui-full:
    runs-on: ubuntu-latest
    needs: api-full
    env:
      WEB_BASE_URL: https://dev-manzil.greatmall.uz
      API_BASE_URL: https://dev-manzil.greatmall.uz
      SUPPLIER_ADMIN_REAL_EMAIL: ${{ secrets.SUPPLIER_ADMIN_REAL_EMAIL }}
      SUPPLIER_DISPATCHER_REAL_EMAIL: ${{ secrets.SUPPLIER_DISPATCHER_REAL_EMAIL }}
      SUPPLIER_MANAGER_REAL_EMAIL: ${{ secrets.SUPPLIER_MANAGER_REAL_EMAIL }}
      TK_REAL_EMAIL: ${{ secrets.TK_REAL_EMAIL }}
      REAL_ACCOUNT_PASSWORD: ${{ secrets.REAL_ACCOUNT_PASSWORD }}
      UI_HEADED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - name: UI suite
        run: pytest web_ui/ -n 2 --tb=short
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: allure-ui-nightly, path: allure-results/, retention-days: 30 }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: playwright-traces/, retention-days: 14 }
