[pytest]
minversion = 8.0
testpaths = tests web_ui mobile
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --alluredir=allure-results

markers =
    smoke: fast positive happy-path tests
    positive: positive UC coverage
    negative: negative paths and validation errors
    rbac: role-based access control (JWT realm roles)
    edge_case: edge cases and races
    e2e: full cross-role end-to-end scenario (currently parked — backend incomplete)
    maintenance: cleanup of test data
    serial: must run sequentially
    requires_email_otp: needs an email-OTP capture mechanism (mailhog or fixed code)
    requires_telegram_otp: needs a telegram-OTP capture mechanism (test bot or fixed code)
    property: hypothesis-driven property-based tests (random payload generation)
    schemathesis: openapi.json-driven contract validation (auto-generated from spec)
    security: BOLA, mass assignment, JWT manipulation, injection
    contract: HTTP protocol details — content-type, methods, CORS, error shape consistency
    concurrency: real parallel-request invariants (uniqueness, race-free state)
    timing: TTL / clock-dependent (most need backend test-clock support)
    slow: tests that intentionally make many requests (rate-limiting probes)
    ui: web-ui tests driven by Playwright (slower, browser-based)
    ui_supplier: UI tests run as a Supplier role
    ui_tk: UI tests run as a TK_ADMIN role
    ui_cross: UI tests that drive two browser contexts (supplier + tk) in one scenario
    requires_real_account: post-OTP UI tests using the shared Supplier/TK accounts (cannot run in parallel against the same account)
    mobile: mobile UI tests via Maestro (slow, requires device/emulator + maestro CLI)
    mobile_android: subset that runs only on Android
    mobile_ios: subset that runs only on iOS
    mobile_smoke: fast mobile-smoke subset
    requires_device: requires a running emulator or connected device
    requires_maestro: requires `maestro` CLI in PATH

filterwarnings =
    error
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
