[pytest]
# UI-only sanity suite. Run: pytest -m sanity
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir
    --junitxml=reports/junit.xml
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=artifacts

markers =
    sanity: daily UI sanity set (the whole suite)
    workflow: cross-role end-to-end workflow (order lifecycle)
    smoke: single-page load smoke
    uat: automated UAT checklist cases (maps to manzil-uat-checklist.xlsx)
    super_admin: UAT — Super admin role
    admin: UAT — Admin (shipper) role
    manager: UAT — Manager role
    tk: UAT — Transport company role
    warehouse: UAT — Warehouse (mobile) role
    api: UAT — backend API cases (auth, RBAC)
    infra: infrastructure smoke (API-seed, not a UAT case)
    # ─── Regression suite (tests/regression, runs on DEV; separate from UAT) ──
    regression: full library coverage set (tests/regression)
    web: regression layer — Web (Playwright)
    mobile: regression layer — Mobile (Maestro)
    high: priority High case
    medium: priority Medium case
    low: priority Low case
    negative: negative-path case
    rbac: role/capability access case
    tenancy: multi-company isolation case
    capability: capability-grant / enforcement case
    boundary: boundary/limit case
    i18n: localization case
    lifecycle: order/offer lifecycle chain
    validation: input-validation case
    security: security/authz case
    idempotency: idempotent-operation case (retry/duplicate → single effect)
    conflict: resource-conflict (409) case
    pagination: pagination / page-shape case
    state: state-dependent / verification-status case
    session: session/token revocation case
    ratelimit: 429 rate-limit case — serial, dedicated phones only (not -n auto)
    regotp: registration/reset OTP-request case — burns the shared 20/10-min OTP IP budget; run SERIAL via run_registration_otp.sh, excluded from the -n4 main run
    iplimit: IP-bucket case (≥5 failed logins / OTP-IP exhaustion) — run ISOLATED (-m iplimit); exceeds the shared 10-min IP budget if mixed with other rate-limit tests
    slow: long-running case
    manual_setup: needs a stand prepared with a developer — test skips (visible, not simulated)
