[pytest]
# UI-only sanity suite. Run: pytest -m sanity
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=allure-results
    --clean-alluredir
    --junitxml=reports/junit.xml
    --browser=chromium
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure
    --output=artifacts

markers =
    sanity: daily UI sanity set (the whole suite)
    workflow: cross-role end-to-end workflow (order lifecycle)
    smoke: single-page load smoke
    uat: automated UAT checklist cases (maps to manzil-uat-checklist.xlsx)
    super_admin: UAT — Super admin role
    admin: UAT — Admin (shipper) role
    manager: UAT — Manager role
    tk: UAT — Transport company role
    warehouse: UAT — Warehouse (mobile) role
    api: UAT — backend API cases (auth, RBAC)
    infra: infrastructure smoke (API-seed, not a UAT case)
