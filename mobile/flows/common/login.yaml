# Reusable login subflow — phone + password, no OTP. App UI is in UZBEK.
# Confirmed against staging build uz.logos.manzil.warehouse.staging on emulator.
# Phone field is national-only (the +998 prefix is fixed in the UI).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn: "00 000 00 00"          # phone field placeholder
- inputText: ${PHONE}            # national digits only (e.g. 988078176)
- tapOn: "Parol"                 # password field (label sits over the input)
- inputText: ${PASSWORD}
- tapOn: "Kirish"                # login button
# Android may offer to save the password — dismiss it if shown.
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- assertVisible:
    text: "Ariza yaratish"       # FAB on the orders home — proves we're logged in
