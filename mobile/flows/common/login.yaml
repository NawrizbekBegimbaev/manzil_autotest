# Reusable login subflow — phone + password, no OTP. App UI is in UZBEK.
# Confirmed against staging build uz.logos.manzil.warehouse.staging on emulator.
# Phone field is national-only (the +998 prefix is fixed in the UI).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      all: allow                 # pre-grant so no runtime permission prompt blocks login
# Android 13 may still show the POST_NOTIFICATIONS prompt on a fresh install —
# dismiss it if it appears, then wait for the login screen before typing.
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    visible: "00 000 00 00"
    timeout: 20000
- tapOn: "00 000 00 00"          # phone field placeholder
- inputText: ${PHONE}            # national digits only (e.g. 988078176)
- tapOn: "Parol"                 # password field (label sits over the input)
- inputText: ${PASSWORD}
- tapOn: "Kirish"                # login button
# Android may offer to save the password — dismiss it if shown.
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
# Wait up to 30s for the orders home — absorbs cold-start slowness (login makes a
# network call). extendedWaitUntil supports a timeout; assertVisible does not.
- extendedWaitUntil:
    visible:
      text: "Ariza yaratish"     # FAB on the orders home — proves we're logged in
    timeout: 30000
