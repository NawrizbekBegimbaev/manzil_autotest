appId: ${APP_ID}
tags:
  - profile
  - post-login
---
- runFlow:
    file: ../_common/login_as_driver.yaml
- tapOn: "Profil"
- assertVisible:
    text: ${DRIVER_FULL_NAME}
    timeout: 5000
- assertVisible: ${DRIVER_PHONE_FULL}
- assertVisible: "Shaxsiy ma'lumotlar"
- assertVisible: "To'liq ism"
- assertVisible: "Telefon"
- assertVisible: "Haydovchilik guvohnomasi"
- assertVisible: "Raqami"
- assertVisible: "Seriyasi"
- assertVisible: "Berilgan sana"
- assertVisible: "Amal qilish muddati"
