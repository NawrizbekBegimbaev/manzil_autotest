appId: ${APP_ID}
tags:
  - offers
  - mutation
  - requires_real_account
---
- runFlow:
    file: ../_common/login_and_open_first_order.yaml
- tapOn: "Taklif yuborish"
- assertVisible: "Taklif"
- tapOn: "Masalan, 1 200"
- inputText: "1500"
- hideKeyboard
- tapOn: "Ixtiyoriy, 250 belgigacha"
- inputText: "[E2E-W2] auto-probe offer"
- hideKeyboard
- tapOn: "Yuborish"
- extendedWaitUntil:
    notVisible: "Masalan, 1 200"
    timeout: 8000
- assertNotVisible: "O'zgarishlar saqlanmaydi"
