# M2. Warehouse operator creates + publishes an order (ariza) — mobile-only step.
# Updated for the fixed address UI (BUG-011 resolved in the build): the address
# sheet now has a saved-address list + «Oʻz manzilingizni qoʻshish» → a form with
# Davlat (Xitoy/Qirgʻiziston) + a CITY SEARCH (picks a real city → cityId) + free
# «Aniq manzil». This finally sends cityId, so POST /warehouse/locations succeeds.
#
# Route addresses save server-side per account: a fresh account shows the
# placeholders «Yuklash manzili»/«Yetkazib berish manzili» and we add an address;
# an account that already has saved warehouses defaults to them (the add block is
# skipped via `when:`). Loading date defaults to today.
appId: ${APP_ID}
---
- runFlow:
    file: common/login.yaml
    env:
      PHONE: ${WAREHOUSE_PHONE}
      PASSWORD: ${WAREHOUSE_PASSWORD}

- tapOn: "Ariza yaratish"        # create FAB
- tapOn: "Avtomobil"             # transport type
- tapOn: "BIG 800"               # vehicle type chip
- tapOn: "1 haydovchi"           # drivers count

# --- Loading (from) address — add only if the placeholder is still shown ---
- runFlow:
    when:
      visible: "Yuklash manzili"
    commands:
      - tapOn: "Yuklash manzili"
      - tapOn: "Oʻz manzilingizni qoʻshish"   # add a new address
      - tapOn: "Xitoy"                        # country: China
      - tapOn: "Shaharni qidirish"            # city search field
      - inputText: "Beijing"
      - extendedWaitUntil:
          visible: "北京市 • bei jing"
          timeout: 10000
      - tapOn: "北京市 • bei jing"             # pick the city from search results
      - tapOn: "Koʻcha, uy, xonadon"          # exact address field
      - inputText: "Loading street 1"
      - hideKeyboard
      - tapOn: "Manzilni saqlash"             # save → address added to the route

# --- Delivery (to) address — same, only if its placeholder is still shown ---
- runFlow:
    when:
      visible: "Yetkazib berish manzili"
    commands:
      - tapOn: "Yetkazib berish manzili"
      - tapOn: "Oʻz manzilingizni qoʻshish"
      - tapOn: "Xitoy"
      - tapOn: "Shaharni qidirish"
      - inputText: "Beijing"
      - extendedWaitUntil:
          visible: "北京市 • bei jing"
          timeout: 10000
      - tapOn: "北京市 • bei jing"
      - tapOn: "Koʻcha, uy, xonadon"
      - inputText: "Delivery street 2"
      - hideKeyboard
      - tapOn: "Manzilni saqlash"

# --- Review + publish ---
- tapOn: "Koʻrib chiqish"        # review
- tapOn: "Eʼlon qilish"          # publish
- assertVisible: "Eʼlon qilindi" # order appears under the "Published" tab
