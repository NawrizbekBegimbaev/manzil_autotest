# SK-12: open an IN_WORK order → mark driver communication status.
# Params: WAREHOUSE_PHONE, WAREHOUSE_PASSWORD, TAB, ORDER_NO.
# BUG-012 fixed: the dialog «Haydovchi bilan bogʻlandingizmi?» now offers the real
# enum — Tasdiqlandi (CONFIRMED) / Rad etildi (DECLINED) / Aloqasiz (UNAVAILABLE) /
# Bogʻlanish (PENDING); POST /communication → 204.
appId: ${APP_ID}
---
- runFlow:
    file: common/login.yaml
    env:
      PHONE: ${WAREHOUSE_PHONE}
      PASSWORD: ${WAREHOUSE_PASSWORD}
- tapOn: ${TAB}
- tapOn: ${ORDER_NO}
- tapOn: "Haydovchi bilan aloqa"      # communication row
- tapOn: "Tasdiqlandi"                # CONFIRMED
- assertVisible: "Tasdiqlandi"        # communication status flips to «Tasdiqlandi»
