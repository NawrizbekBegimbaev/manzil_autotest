# SK-13: open an IN_WORK order → confirm driver communication → send goods → «Yoʻlda».
# Params: WAREHOUSE_PHONE, WAREHOUSE_PASSWORD, TAB, ORDER_NO.
# BUG-012 fixed: communication (Tasdiqlandi → 204) enables «Yuk joʻnatildi»; the
# send-goods confirm dialog («Yuk joʻnatilganini tasdiqlaysizmi?») → POST /goods-sent
# 200 → order moves to «Yoʻlda» (IN_TRANSIT).
appId: ${APP_ID}
---
- runFlow:
    file: common/login.yaml
    env:
      PHONE: ${WAREHOUSE_PHONE}
      PASSWORD: ${WAREHOUSE_PASSWORD}
- tapOn: ${TAB}
- tapOn: ${ORDER_NO}
- tapOn: "Haydovchi bilan aloqa"
- tapOn: "Tasdiqlandi"                # confirm communication first
- tapOn: "Yuk joʻnatildi"             # "Goods sent" button → confirm dialog
- assertVisible: ".*tasdiqlaysizmi.*" # «Yuk joʻnatilganini tasdiqlaysizmi?»
- tapOn: "Yuk joʻnatildi"             # confirm in the dialog
- assertVisible: "Yoʻlda"             # order moved to «In transit»
