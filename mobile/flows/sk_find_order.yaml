# Login → open a status tab → assert a specific order number is visible there.
# Params: WAREHOUSE_PHONE, WAREHOUSE_PASSWORD, TAB (uz tab label), ORDER_NO.
appId: ${APP_ID}
---
- runFlow:
    file: common/login.yaml
    env:
      PHONE: ${WAREHOUSE_PHONE}
      PASSWORD: ${WAREHOUSE_PASSWORD}
# Status tabs are a horizontal strip; with many orders they overflow and the last
# one («Tugallangan») sits off-screen right. If the target tab isn't visible, swipe
# the tab strip left to reveal it (only then — so leftmost tabs aren't pushed away).
- runFlow:
    when:
      notVisible: ${TAB}
    commands:
      - swipe:
          start: "85%, 8%"
          end: "12%, 8%"
- extendedWaitUntil:
    visible: ${TAB}
    timeout: 8000
- tapOn: ${TAB}
- assertVisible: ${ORDER_NO}
