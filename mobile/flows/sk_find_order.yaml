# Login → open a status tab → assert a specific order number is visible there.
# Params: WAREHOUSE_PHONE, WAREHOUSE_PASSWORD, TAB (uz tab label), ORDER_NO.
appId: ${APP_ID}
---
- runFlow:
    file: common/login.yaml
    env:
      PHONE: ${WAREHOUSE_PHONE}
      PASSWORD: ${WAREHOUSE_PASSWORD}
# The status tabs are a horizontal strip; the last one («Tugallangan») can sit
# off-screen — scroll it into view first, then open it.
- scrollUntilVisible:
    element:
      text: ${TAB}
    direction: RIGHT
    timeout: 10000
- tapOn: ${TAB}
- assertVisible: ${ORDER_NO}
